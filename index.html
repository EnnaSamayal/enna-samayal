<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enna Samayal – Your Tamil Kitchen Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="welcome">
    <div class="welcome-content">
      <h1>Vanakkam! 🙏 Welcome to Enna Samayal!</h1>
      <p>So happy you're here. 💚</p>
      <p>What shall we cook together today?</p>

      <form class="chat-form">
        <input
          type="text"
          placeholder="Tell me what you'd like to cook..."
          aria-label="Tell me what you'd like to cook"
        >
        <button type="submit">Send</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
