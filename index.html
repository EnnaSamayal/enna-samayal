<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enna Samayal</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #f7f5ed;
      color: #26392d;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      color: #245b3e;
      font-family: Georgia, serif;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 100px;
      padding: 12px;
      margin: 10px 0;
      font: inherit;
      border: 1px solid #ccd5c9;
      border-radius: 8px;
    }

    button {
      padding: 11px 14px;
      margin: 4px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }

    button:focus-visible {
      outline: 3px solid #9a642e;
      outline-offset: 3px;
    }

    .ideas-toggle {
      background: transparent;
      color: #286443;
      padding-left: 0;
      font-size: 14px;
      font-weight: bold;
    }

    .try {
      background: #e7f0e3;
      color: #245b3e;
    }

    #examples {
      margin: 5px 0 12px;
      padding: 12px;
      background: #f7f9f3;
      border-radius: 10px;
    }

    #find {
      display: block;
      width: 100%;
      margin: 15px 0;
      background: #286443;
      color: white;
      font-size: 16px;
    }

    .recipe {
      margin-top: 15px;
      padding: 16px;
      background: #f7f9f3;
      border-radius: 10px;
    }

    .recipe h3 {
      color: #245b3e;
    }

    #status {
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      main {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div style="font-size:44px">🍲</div>
      <p>YOUR TAMIL KITCHEN COMPANION</p>
      <h1>Enna Samayal?</h1>
      <p>Tell us what you have. Let's find something delicious!</p>
    </header>

    <label for="ingredients">
      <strong>What ingredients do you have?</strong>
    </label>

    <textarea
      id="ingredients"
      placeholder="e.g. rice, tomato, onion"
    ></textarea>

    <button
      type="button"
      class="ideas-toggle"
      id="ideasToggle"
      aria-expanded="false"
      aria-controls="examples"
      onclick="toggleIdeas()"
    >
      + Need ideas?
    </button>

    <div id="examples" hidden>
      <p>Choose an example to get started:</p>

      <button
        type="button"
        class="try"
        onclick="choose('rice, tomato, onion')"
      >
        Tomato Rice
      </button>

      <button
        type="button"
        class="try"
        onclick="choose('rice, lemon, peanuts')"
      >
        Lemon Rice
      </button>

      <button
        type="button"
        class="try"
        onclick="choose('rice, curd')"
      >
        Curd Rice
      </button>
    </div>

    <button type="button" id="find" onclick="findRecipes()">
      Find My Recipes →
    </button>

    <p id="status" role="status">
      Enter your ingredients and click Find My Recipes.
    </p>

    <div id="results" aria-live="polite"></div>
  </main>

  <script>
    function toggleIdeas() {
      var examples = document.getElementById("examples");
      var toggle = document.getElementById("ideasToggle");

      var isOpening = examples.hidden;

      examples.hidden = !isOpening;
      toggle.setAttribute("aria-expanded", String(isOpening));
      toggle.textContent = isOpening
        ? "− Hide examples"
        : "+ Need ideas?";
    }

    function choose(value) {
      document.getElementById("ingredients").value = value;
      findRecipes();
    }

    function findRecipes() {
      var input = document.getElementById("ingredients").value.trim();
      var status = document.getElementById("status");
      var results = document.getElementById("results");

      results.innerHTML = "";

      if (!input) {
        status.textContent = "Please type some ingredients first.";
        document.getElementById("ingredients").focus();
        return;
      }

      var words = input.toLowerCase().split(",").map(function(x) {
        return x.trim();
      });

      var recipes = [
        {
          name: "Tomato Rice",
          needs: ["rice", "tomato", "onion"],
          steps: "Cook rice. Sauté onion in oil, add chopped tomato and spices, cook until soft, then mix with rice."
        },
        {
          name: "Lemon Rice",
          needs: ["rice", "lemon"],
          steps: "Cook rice and let it cool slightly. Add lemon juice and salt. Mix with a turmeric and mustard-seed tempering if available."
        },
        {
          name: "Curd Rice",
          needs: ["rice", "curd"],
          steps: "Mix cooked, cooled rice with curd and salt. Add a little milk if needed. A mustard-seed and curry-leaf tempering is optional."
        },
        {
          name: "Onion Rice",
          needs: ["rice", "onion"],
          steps: "Sauté sliced onion until golden. Add salt and pepper, then stir in cooked rice."
        }
      ];

      var found = recipes.filter(function(recipe) {
        return recipe.needs.some(function(need) {
          return words.some(function(word) {
            return word && (
              word.includes(need) || need.includes(word)
            );
          });
        });
      });

      if (found.length === 0) {
        status.textContent =
          "No matching recipes yet. Try rice, tomato, onion, lemon or curd.";
        return;
      }

      status.textContent = "Found " + found.length + " recipe ideas!";

      found.forEach(function(recipe) {
        var card = document.createElement("div");
        card.className = "recipe";

        var heading = document.createElement("h3");
        heading.textContent = recipe.name;

        var steps = document.createElement("p");
        steps.textContent = recipe.steps;

        card.appendChild(heading);
        card.appendChild(steps);
        results.appendChild(card);
      });
    }
  </script>
</body>
</html>
